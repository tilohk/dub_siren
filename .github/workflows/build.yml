name: Build

# Builds and tests dub_siren on macOS, Windows and Linux: the DSP tests, pluginval at
# strictness 10 on every plug-in format, and auval for the Audio Unit.
# Pushing a tag "vX.Y.Z" also creates a draft GitHub release with the zipped plug-ins. Publish the
# draft to make it "latest": packaging/install-macos.sh can then download it with the GitHub CLI.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            cmake_args: -G Ninja "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          - name: Windows
            os: windows-2022
            cmake_args: -G "Visual Studio 17 2022" -A x64
          - name: Linux
            os: ubuntu-22.04
            cmake_args: -G Ninja

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev \
            mesa-common-dev xvfb

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSIREN_COPY_PLUGIN=OFF ${{ matrix.cmake_args }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel --target DubSiren_All SirenDspTest

      - name: Test
        shell: bash
        working-directory: build
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest -C Release --output-on-failure
          else
            ctest -C Release --output-on-failure
          fi

      - name: Install pluginval
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)   zip=pluginval_macOS.zip ;   bin=pluginval.app/Contents/MacOS/pluginval ;;
            Windows) zip=pluginval_Windows.zip ; bin=pluginval.exe ;;
            Linux)   zip=pluginval_Linux.zip ;   bin=pluginval ;;
          esac
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/$zip"
          mkdir -p build/pluginval-bin && unzip -q pluginval.zip -d build/pluginval-bin
          chmod +x "build/pluginval-bin/$bin" || true
          echo "PLUGINVAL=$PWD/build/pluginval-bin/$bin" >> "$GITHUB_ENV"

      - name: pluginval
        shell: bash
        run: |
          art=build/DubSiren_artefacts/Release
          plugins=("$art/VST3/dub_siren.vst3")
          [ "$RUNNER_OS" = "macOS" ] && plugins+=("$art/AU/dub_siren.component")
          [ "$RUNNER_OS" = "Linux" ] && plugins+=("$art/LV2/dub_siren.lv2")
          run=()
          [ "$RUNNER_OS" = "Linux" ] && run=(xvfb-run -a)
          for p in "${plugins[@]}"; do
            echo "::group::pluginval $p"
            "${run[@]}" "$PLUGINVAL" --strictness-level 10 --validate-in-process --timeout-ms 600000 \
              --output-dir pluginval-logs --validate "$p"
            echo "::endgroup::"
          done

      - name: auval
        if: runner.os == 'macOS'
        run: |
          # auval only finds Audio Units in the plug-in folders.
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/DubSiren_artefacts/Release/AU/dub_siren.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -a | grep -q "aumu Dbsr Tlhk" || sleep 5
          auval -strict -v aumu Dbsr Tlhk

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: pluginval-logs-${{ matrix.name }}
          path: pluginval-logs
          if-no-files-found: ignore

      - name: Package
        shell: bash
        run: |
          version=$(sed -n 's/^project(DubSiren VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          art=build/DubSiren_artefacts/Release
          out="dub_siren-${version}-${{ matrix.name }}"
          mkdir -p "dist/$out"
          cp -R "$art/VST3/dub_siren.vst3" "dist/$out/"
          case "$RUNNER_OS" in
            macOS)
              cp -R "$art/AU/dub_siren.component" "dist/$out/"
              cp -R "$art/Standalone/dub_siren.app" "dist/$out/"
              # Not notarised: sign ad hoc so the bundles at least carry a valid signature.
              for b in "dist/$out"/*; do codesign --force --deep --sign - "$b"; done ;;
            Windows)
              cp "$art/Standalone/dub_siren.exe" "dist/$out/" ;;
            Linux)
              cp -R "$art/LV2/dub_siren.lv2" "dist/$out/"
              cp "$art/Standalone/dub_siren" "dist/$out/" ;;
          esac
          cp README.md CHANGELOG.md LICENSE "dist/$out/"
          sed "s/@VERSION@/$version/" packaging/INSTALL.txt > "dist/$out/INSTALL.txt"
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp packaging/install-macos.sh "dist/$out/" && chmod +x "dist/$out/install-macos.sh"
          fi
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -tzip "$out.zip" "$out" > /dev/null
          else ditto -c -k --keepParent "$out" "$out.zip" 2>/dev/null || zip -qry "$out.zip" "$out"; fi

      - uses: actions/upload-artifact@v7
        with:
          name: dub_siren-${{ matrix.name }}
          path: dist/*.zip

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: notes.md
          files: dist/*.zip
